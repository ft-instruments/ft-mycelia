<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MYCELIA</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%23050b09'/%3E%3Ccircle cx='8' cy='8' r='2.2' fill='%2378ffc8'/%3E%3Ccircle cx='3' cy='4' r='1.2' fill='%23ff5adc'/%3E%3Ccircle cx='13' cy='12' r='1.2' fill='%2335f0e6'/%3E%3Cpath d='M3 4 L8 8 L13 12' stroke='%2378ffc8' stroke-width='.8' fill='none' opacity='.7'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/ft.css" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="organism"></canvas>
    <div class="vignette"></div>
    <div class="grain"></div>

    <!-- shared by every knob: the lit cap and the tip's glow -->
    <svg class="defs" width="0" height="0" aria-hidden="true">
      <defs>
        <radialGradient id="ftCap" cx="0.38" cy="0.3" r="0.8">
          <stop offset="0" stop-color="#3a4a47" />
          <stop offset="0.55" stop-color="#172220" />
          <stop offset="1" stop-color="#0a100f" />
        </radialGradient>
        <radialGradient id="ftWell" cx="0.5" cy="0.5" r="0.5">
          <stop offset="0.7" stop-color="#000" stop-opacity="0.55" />
          <stop offset="1" stop-color="#000" stop-opacity="0" />
        </radialGradient>
      </defs>
    </svg>

    <div id="app">
      <header class="bar">
        <div class="brand">
          <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
            <path class="hypha" d="M16 17 C13 12 10 11 6 9" />
            <path class="hypha" d="M16 17 C18 11 22 9 25 5" />
            <path class="hypha" d="M16 17 C21 18 24 21 27 25" />
            <path class="hypha" d="M16 17 C14 22 10 24 7 27" />
            <path class="hypha thin" d="M10 11 C9 14 7 15 4 16" />
            <path class="hypha thin" d="M22 20 C23 16 26 15 29 14" />
            <circle class="node n1" cx="16" cy="17" r="3.2" />
            <circle class="node n2" cx="6" cy="9" r="1.8" />
            <circle class="node n3" cx="25" cy="5" r="1.5" />
            <circle class="node n4" cx="27" cy="25" r="1.9" />
            <circle class="node n5" cx="7" cy="27" r="1.3" />
            <circle class="node n3" cx="4" cy="16" r="1" />
            <circle class="node n2" cx="29" cy="14" r="1.1" />
          </svg>
          <div>
            <h1>mycelia</h1>
            <span class="sub">bioluminescent polysynth <b>·</b> ft</span>
          </div>
        </div>

        <div class="presets">
          <button id="prev" class="round" title="previous preset">
            <svg viewBox="0 0 16 16"><path d="M10 3.5 5.5 8l4.5 4.5" /></svg>
          </button>
          <button id="browse" title="browse the presets (`)">
            <span class="tag" id="preset-tag">pad</span>
            <span class="nm" id="preset-name">Canopy</span>
          </button>
          <button id="next" class="round" title="next preset">
            <svg viewBox="0 0 16 16"><path d="M6 3.5 10.5 8 6 12.5" /></svg>
          </button>
          <div class="actions">
            <button id="spore" class="chip" title="mutate the current sound a little">
              <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2" /><circle cx="3" cy="4" r="1.1" /><circle cx="13" cy="4.5" r="1" /><circle cx="12" cy="12.5" r="1.2" /><circle cx="3.5" cy="12" r="0.9" /></svg>
              spore
            </button>
            <button id="save" class="chip" title="save this sound as a preset (⌘S)">
              <svg viewBox="0 0 16 16"><path d="M3 2.5h8l2.5 2.5v8.5h-10.5Z" /><path d="M5.5 2.5v3.5h4.5V2.5M5.5 13.5v-4h5v4" /></svg>
              save
            </button>
            <button id="copy" class="chip" title="copy patch JSON to clipboard">
              <svg viewBox="0 0 16 16"><rect x="5.5" y="5.5" width="8" height="8.5" rx="2" /><path d="M3.5 10.5V4a2 2 0 0 1 2-2H10" /></svg>
              copy
            </button>
          </div>
        </div>

        <div class="scopewrap"><canvas id="scope"></canvas></div>

        <div class="status">
          <div class="io">
            <label class="master" title="master volume">
              <svg viewBox="0 0 16 16"><path d="M2.5 6h2.2L8 3v10L4.7 10H2.5Z" /><path d="M10.5 5.5a3.5 3.5 0 0 1 0 5M12.3 3.8a6 6 0 0 1 0 8.4" /></svg>
              <input id="master" type="range" min="0" max="1" step="0.01" value="0.7" />
            </label>
            <div class="midi" title="MIDI input">
              <span id="midi-led" class="led"></span>
              <select id="midi-port"><option value="all">all MIDI inputs</option></select>
            </div>
          </div>
          <div class="io">
            <span id="stats" class="muted"></span>
            <button id="panic" class="chip" title="stop all sound">panic</button>
          </div>
          <div class="power-wrap">
            <button id="start" class="power" title="wake the synth">
              <svg viewBox="0 0 16 16"><path d="M8 2v5.5" /><path d="M4.6 4.3a5 5 0 1 0 6.8 0" /></svg>
            </button>
            <span id="start-label">wake</span>
          </div>
        </div>
      </header>

      <nav id="tabs" class="tabs"><span class="tab-light"></span></nav>
      <main id="panels"></main>

      <footer>
        <canvas id="keyboard"></canvas>
        <div class="hint muted">
          <kbd>A</kbd>–<kbd>'</kbd> <kbd>Z</kbd>–<kbd>/</kbd> play · <kbd>←</kbd><kbd>→</kbd> octave <span id="octave">C4</span> · <kbd>Shift</kbd> louder · <kbd>Space</kbd> sustain · <kbd>1</kbd>–<kbd>4</kbd> families · <kbd>`</kbd> presets · drag knobs, <kbd>Shift</kbd> fine, double-click resets
        </div>
      </footer>
    </div>

    <!-- preset browser -->
    <div id="browser" class="browser" hidden>
      <div class="sheet">
        <div class="head">
          <h2>the garden</h2>
          <input id="browser-search" type="search" placeholder="search presets…" autocomplete="off" spellcheck="false" />
          <button id="browser-save" class="chip" title="save the current sound (⌘S)">save current</button>
          <button id="browser-close" class="chip" title="close (Esc)">esc</button>
        </div>
        <form id="savebar" class="savebar" hidden>
          <label for="save-name">save as</label>
          <input id="save-name" type="text" maxlength="40" autocomplete="off" spellcheck="false" placeholder="name your sound" />
          <button id="save-ok" type="submit" class="chip primary">save</button>
          <button id="save-cancel" type="button" class="chip">cancel</button>
          <span id="save-msg" class="msg"></span>
        </form>
        <div class="split">
          <nav id="browser-side" class="side"></nav>
          <div id="browser-list" class="list"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
